spring.application.name=bons
server.port=${SERVER_PORT:8083}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=never

services.chargements.url=${CHARGEMENTS_BASE_URL:http://localhost:8082}
services.chargements.connect-timeout=2000
services.chargements.read-timeout=3000

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8090/realms/transport-ws}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=bons-api

spring.security.oauth2.client.registration.bons.provider=transport
spring.security.oauth2.client.registration.bons.client-id=bons-service
spring.security.oauth2.client.registration.bons.client-secret=${BONS_CLIENT_SECRET}
spring.security.oauth2.client.registration.bons.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.transport.token-uri=${AUTH_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
