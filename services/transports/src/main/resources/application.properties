spring.application.name=transports
server.port=8084

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

services.bons.url=${BONS_BASE_URL:http://localhost:8083}
services.camions.url=${CAMIONS_BASE_URL:http://localhost:8081}

spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8090/realms/transport-ws}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=transports-api

app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}

spring.security.oauth2.client.registration.transports.provider=transport
spring.security.oauth2.client.registration.transports.client-id=transports-service
spring.security.oauth2.client.registration.transports.client-secret=${TRANSPORTS_CLIENT_SECRET}
spring.security.oauth2.client.registration.transports.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.transport.token-uri=${AUTH_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}