spring.application.name=chargements
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=never

camions.service.url=${CAMIONS_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.camions.connectTimeout=2000
spring.cloud.openfeign.client.config.camions.readTimeout=3000
spring.cloud.openfeign.client.config.camions.loggerLevel=none

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never
