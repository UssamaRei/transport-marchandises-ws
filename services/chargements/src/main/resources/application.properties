spring.application.name=chargements
server.port=${SERVER_PORT:8082}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=3
spring.datasource.hikari.minimum-idle=0
spring.datasource.hikari.connection-timeout=30000
spring.sql.init.mode=never

camions.service.url=${CAMIONS_SERVICE_URL:http://localhost:8081}
spring.cloud.openfeign.client.config.camions.connectTimeout=2000
spring.cloud.openfeign.client.config.camions.readTimeout=3000
spring.cloud.openfeign.client.config.camions.loggerLevel=none

spring.jackson.deserialization.fail-on-unknown-properties=true
spring.jackson.deserialization.accept-float-as-int=false
server.error.include-message=never
server.error.include-stacktrace=never

# Validation des JWT emis par le fournisseur commun.
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER_URI:http://localhost:8090/realms/transport-ws}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWK_SET_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
spring.security.oauth2.resourceserver.jwt.audiences=chargements-api

# OpenFeign obtient son propre jeton ; il ne transmet pas le jeton de l'utilisateur.
spring.security.oauth2.client.registration.camions.provider=transport
spring.security.oauth2.client.registration.camions.client-id=chargements-service
spring.security.oauth2.client.registration.camions.client-secret=${CHARGEMENTS_CLIENT_SECRET}
spring.security.oauth2.client.registration.camions.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.transport.token-uri=${AUTH_TOKEN_URI:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/token}
spring.cloud.openfeign.oauth2.enabled=true
spring.cloud.openfeign.oauth2.clientRegistrationId=camions
app.cors.allowed-origins=${FRONTEND_ORIGINS:http://localhost:5173,http://localhost:3000}
