# Base locale facultative. L’équipe utilise la base commune hébergée sur Neon.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: transport_db
      POSTGRES_USER: transport
      POSTGRES_PASSWORD: ${LOCAL_DB_PASSWORD:?Copier .env.example vers .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transport -d transport_db"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres-data:
